# ⚠️ 内存配置（2026-11 实测复核）：
#   本机实测：物理内存 64GB（空闲 52GB），页面文件 4096MB 由系统自动管理。
#   （历史记录曾称"15.6G 且空闲仅 2~3G"，2026-11 复测已推翻该前提。）
#   但即便内存充足，仍保留较保守的堆上限，原因：
#     ① Gradle/Kotlin daemon 叠加 JVM 会虚占内存，下调上限可减少构建期抖动；
#     ② 该配置已在真机首次 Android 构建中验证可用，无必要冒进上调。
#   若将来构建出现 OOM（如引入更多原生依赖模块），可按需上调 -Xmx（16G 内安全）。
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Dhttp.proxyHost=127.0.0.1 -Dhttp.proxyPort=7897 -Dhttps.proxyHost=127.0.0.1 -Dhttps.proxyPort=7897 -Dhttp.nonProxyHosts=localhost|127.0.0.1|::1
org.gradle.daemon=true
# 实测内存充足，允许并行与多 worker 以缩短构建时间
org.gradle.parallel=true
org.gradle.configureondemand=true
# Kotlin 走进程内编译：省掉一个独立 Kotlin daemon JVM（本机实测更快更稳）
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
