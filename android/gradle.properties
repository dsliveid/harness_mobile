# ⚠️ 内存配置（2026-11，首次 Android 构建实测，勿随手上调）：
#   本机物理内存 15.6G 但常驻空闲仅 2~3G，页面文件固定 2048MB（PeakUsage 仅 226MB，
#   说明瓶颈是物理内存而非页面文件）。原配置 -Xmx4G + MaxMetaspace2G 会导致：
#     "insufficient memory ... mmap failed" / "Failed to reserve memory for
#      new overflow mark stack" 等 JVM 启动期就崩溃。
#   下调要点：① 堆 1280m ② Metaspace 512m ③ 关 parallel ④ workers=1
#   ⑤ Kotlin 走进程内编译（kotlin.compiler.execution.strategy=in-process），
#      不再额外拉起一个 1G 的 Kotlin daemon JVM。
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=192m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.configureondemand=true
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
