plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.harness.harness_mobile"
    // 显式指定 35：flutter_plugin_android_lifecycle 与 sqlite3_flutter_libs
    // 都要求 compileSdk >= 35（向后兼容，不影响 minSdk 的旧设备）
    compileSdk = 35
    ndkVersion = flutter.ndkVersion

    // Java 17：与 Gradle 8.7 / AGP 8.6.1 / Kotlin 1.9.24 构建链对齐（JDK 21 运行）。
    // 原为 VERSION_1_8，在 JDK 21 的 javac 下会刷 "source value 8 is obsolete" 警告。
    // ⚠️ sourceCompatibility / targetCompatibility 与 kotlinOptions.jvmTarget 必须同值，
    //    否则报 "Inconsistent JVM-target compatibility detected"。
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.harness.harness_mobile"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
