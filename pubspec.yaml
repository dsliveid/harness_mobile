name: harness_mobile
description: "harness 移动端：遥控器 + 轻执行（审批中心、会话订阅、通知、投递）。"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

  # —— 状态与路由 ——
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # —— 网络与流 ——
  dio: ^5.7.0
  web_socket_channel: ^3.0.1

  # —— 本地存储 ——
  # 🔴 drift / sqlite3_flutter_libs / drift_dev 已移除（2026-11，首次 Android 构建实测）：
  #   批次 C 架构收口后本地执行与离线库整体注销，lib/ 与 test/ 对 drift 均为零引用，
  #   但二者仍在 pubspec 存活，导致 sqlite3_flutter_libs 把 NDK 编入 Android 构建链，
  #   触发 "Android sdkmanager did not install NDK 28.2.13676358" 的硬失败。
  #   移除后零功能影响（无任何 Dart 代码引用），且 Android 构建不再需要 NDK。
  #   将来若真要做离线库，需同时恢复依赖并安装对应 NDK。
  flutter_secure_storage: ^9.2.2

  # —— 推送与通知 ——
  # 🔴 firebase_messaging / firebase_core 已移除（2026-11，迁移 Windows 调试时发现）：
  #   firebase_core 虽未在 pubspec 声明 windows 平台，但其包内带有 windows/ C++ 实现，
  #   Flutter 会自动把它编入 Windows 构建，随后因缺 firebase_cpp_sdk 导致
  #   LNK2019/LNK2001（__std_find_last_trivial_1 等）链接失败。
  #   实测 lib/ / test/ / android/ 三处对 firebase 均为零引用，移除不影响现有功能。
  #   将来若要做推送（批次 4），需重新引入并在 Android 侧配 google-services.json；
  #   Windows 端无 firebase 支持，届时需按平台条件加载。
  flutter_local_notifications: ^17.2.2

  # —— 设备能力 ——
  # 🔴 local_auth 已移除（2026-11，取消生物锁）：
  #   原用于「App 级解锁门」（webview_lock.dart + biometric_gate.dart），
  #   单人自用场景下摩擦大于收益，且它带 3 个平台原生实现
  #   （local_auth_android / _darwin / _windows），换来的只是单点弹窗。
  #   连带已删：USE_BIOMETRIC 权限、NSFaceIDUsageDescription、
  #   webview_lock.dart / biometric_gate.dart 及对应测试。
  #   ⚠️ 附带收益：原本 local_auth 强制要求 MainActivity 为
  #   FlutterFragmentActivity（androidx.biometric 的硬约束），
  #   移除后 Android 无需改造 Activity，深链/WebView/singleTop 免回归。
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  # WebView：flutter_inappwebview 同时支持 Android / iOS / Windows（Windows 端
  # 走 WebView2），使 Windows 桌面成为可用的调试目标；webview_flutter 无 Windows 实现。
  flutter_inappwebview: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # 时间旅行测试：退避/心跳定时器必须能在虚拟时钟里快进（P6 连接层）
  fake_async: ^1.3.1

# 🔴 dependency_overrides 必须保留（2026-11 依赖瘦身实测修正）：
#
#   ⚠️ 关键事实：`path_provider` 虽已从直接依赖中移除，但它**仍是传递依赖**，
#   经 `flutter_secure_storage_windows`（必须保留的凭据存储）引入：
#       flutter_secure_storage_windows
#         → path_provider
#           → path_provider_android   ← 问题所在
#             → jni + jni_flutter     ← 自带 C++ 源码（CMakeLists.txt）
#
#   实测：删掉本覆盖后 path_provider_android 会解析到 **2.3.1**，同时把
#   `jni` 与 `jni_flutter` 拉回依赖树，AGP 随即要求 NDK 27.0.12077973，
#   本机无 NDK 则 Android 构建直接硬失败。
#
#   因此这条覆盖**不是**为「直接依赖 path_provider」而存在，而是为打断
#   「凭据存储 → path_provider_android 2.3.x → jni」这条传递链。
#   它必须与 flutter_secure_storage 共存亡。
#
#   ✅ 维护规则：
#   - 保留 `path_provider_android: 2.2.23`（该版本依赖仅 flutter +
#     path_provider_platform_interface，**不含 jni**，API 完全兼容）；
#   - 只有在「已安装 NDK 27」或「flutter_secure_storage 不再依赖
#     path_provider」两种情形之一成立时，才可以移除本覆盖；
#   - 升级 flutter_secure_storage 时须重新跑 `flutter pub deps` 确认
#     jni 未被间接拉回。
dependency_overrides:
  path_provider_android: 2.2.23

flutter:
  uses-material-design: true
