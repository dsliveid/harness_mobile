name: harness_mobile
description: "harness 移动端：遥控器 + 轻执行（审批中心、会话订阅、通知、投递）。"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

  # —— 状态与路由 ——
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # —— 网络与流 ——
  dio: ^5.7.0
  web_socket_channel: ^3.0.1
  http: ^1.2.0

  # —— 本地存储 ——
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.4

  # —— 推送与通知 ——
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^17.2.2

  # —— 设备能力 ——
  image_picker: ^1.1.2
  local_auth: ^2.3.0
  permission_handler: ^11.3.1
  webview_flutter: ^4.9.0
  crypto: ^3.0.5
  uuid: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.12
  mocktail: ^1.0.4
  # 时间旅行测试：退避/心跳定时器必须能在虚拟时钟里快进（P6 连接层）
  fake_async: ^1.3.1

flutter:
  uses-material-design: true
